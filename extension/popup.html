<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow AI Detector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .shield-icon {
      width: 24px;
      height: 24px;
      fill: #38bdf8;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.2px;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 9999px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
    }

    /* Notice Banner */
    .remediation-box {
      margin-bottom: 14px;
    }
    .alternative-notice {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .alt-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #34d399;
    }
    .alt-body {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .alternative-btn {
      display: inline-block;
      margin-top: 4px;
      background: #10b981;
      color: #0f172a;
      font-weight: 700;
      font-size: 11px;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      text-align: center;
      transition: background 0.2s;
    }
    .alternative-btn:hover {
      background: #34d399;
    }
    .no-alt-notice {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      color: #fbbf24;
      line-height: 1.4;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .detection-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .detection-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }
    .detection-card:hover {
      border-color: #38bdf8;
    }
    .tool-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .tool-name {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .tool-domain {
      font-size: 11px;
      color: #64748b;
    }
    .time-badge {
      font-size: 10px;
      color: #94a3b8;
      background: #0f172a;
      padding: 3px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .empty-state {
      text-align: center;
      padding: 20px 10px;
      color: #64748b;
      font-size: 12px;
      background: #1e293b;
      border-radius: 8px;
      border: 1px dashed #334155;
      line-height: 1.5;
    }
    .clear-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 11px;
      text-decoration: underline;
    }
    .clear-btn:hover {
      color: #f43f5e;
    }
    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
      font-size: 10px;
      color: #475569;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg class="shield-icon" viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/>
      </svg>
      <div>
        <div class="title">Shadow AI Detector</div>
        <div class="subtitle">Security & Compliance</div>
      </div>
    </div>
    <div class="status-badge">
      <span class="pulse-dot"></span> Active
    </div>
  </div>

  <!-- Remediation Notice Container -->
  <div id="remediation-container" class="remediation-box"></div>

  <div class="section-title">
    <span>Session Detections</span>
    <button id="clear-btn" class="clear-btn">Clear</button>
  </div>

  <div id="detection-list" class="detection-list">
    <!-- Populated dynamically by popup.js -->
  </div>

  <div class="footer">
    Privacy-Preserving • Domain Match Only
  </div>

  <script src="popup.js"></script>
</body>
</html>
